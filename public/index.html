<!doctype html><html><head><meta charset=utf-8><title>Share List</title><style>body{font-family:system-ui;max-width:600px;margin:40px auto}li{margin:8px 0}</style></head><body>
<h1>Share List — lien magique sans compte</h1>
<button id="create">Créer une liste + lien partage</button>
<div id="app" style="display:none">
<p>Lien: <a id="link" href="#"></a> <button onclick="navigator.clipboard.writeText(link.href)">Copier</button></p>
<input id="input" placeholder="Nouvelle tâche + Entrée"><ul id="list"></ul>
</div>
<script>
let listId=null;
create.onclick=async()=>{const r=await fetch('/api/lists',{method:'POST'});const j=await r.json();location.hash=j.id;load(j.id)};
async function load(id){listId=id;app.style.display='block';link.textContent=location.href;link.href=location.href;refresh()}
async function refresh(){const r=await fetch('/api/lists/'+listId);const j=await r.json();list.innerHTML=j.items.map(i=>`<li><input type=checkbox ${i.done?'checked':''} onchange="toggle('${i.id}',this.checked)"> ${i.text} <button onclick="del('${i.id}')">×</button></li>`).join('')}
async function toggle(id,done){await fetch('/api/items/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done})});refresh()}
async function del(id){await fetch('/api/items/'+id,{method:'DELETE'});refresh()}
input.onkeydown=async e=>{if(e.key==='Enter'&&input.value){await fetch('/api/lists/'+listId+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:input.value})});input.value='';refresh()}};
if(location.hash.slice(1)) load(location.hash.slice(1));
</script></body></html>
